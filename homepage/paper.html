<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper | 3D Gaussian Splatting</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body class="exhibition-page">
    <!-- Navigation -->
    <nav class="nav-glass" style="justify-content: flex-start; gap: 1.5rem;">
        <div class="menu-btn" onclick="toggleSidebar()">
            <div class="h-line"></div>
            <div class="h-line"></div>
            <div class="h-line"></div>
        </div>
        <div class="logo"><a href="index.html">CreatorTheGaphi<span>.</span></a></div>
    </nav>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar" data-lenis-prevent>
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <ul class="sidebar-links">
            <li><a href="index.html#vision" onclick="toggleSidebar()">Vision</a></li>
            <li><a href="exhibition.html">Exhibition</a></li>
            <li><a href="artworks.html">Artworks</a></li>
            <li><a href="paper.html">Paper</a></li>
            <li><a href="index.html#commission" onclick="toggleSidebar()">Commission</a></li>
        </ul>
    </div>

    <!-- Background Canvas (3D scene background) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Exhibition Header -->
    <header class="exhibition-hero" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2;">
        <div class="container text-center reveal-text" data-speed="1.1">
            <h1 class="section-title" id="main-hero-title" style="font-size: clamp(3rem, 7vw, 5rem); margin-bottom: 1rem;">THE PAPER</h1>
            <p class="body-text" id="main-hero-subtitle" style="font-size: 1.2rem; color: var(--text-muted);">Research papers and deep dives into 3D Computer Vision.</p>
        </div>
        
        <div style="position: absolute; bottom: 35px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fadeBob 2s infinite;">
                <span style="font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; font-family: var(--font-tech); color: var(--text-muted); padding-left: 3px;">Scroll Down</span>
                <div style="width: 1px; height: 50px; background: linear-gradient(to bottom, rgba(255,255,255,0.75), rgba(255,255,255,0.05));"></div>
            </div>
        </div>
    </header>

    <!-- Dynamic Content Area -->
    <div id="dynamic-content-area" style="position: relative; z-index: 2; width: 100%;">
        <!-- Papers injected here -->
    </div>

    <!-- Back to Main Button -->
    <div class="back-to-main" style="display: flex; flex-direction: column; align-items: center; padding: 5rem 0 10rem 0; position: relative; z-index: 10;">
        <div style="width: 1px; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7)); margin-bottom: 2rem;"></div>
        <a href="index.html" id="footer-back-btn" class="btn-primary" style="background: transparent; border: 1px solid var(--primary-color);">BACK TO MAIN</a>
    </div>
    
    <footer>
        <p>&copy; 2026 CreatorTheGaphi. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="data/faceData.js"></script>
    <script src="js/script.js"></script>
    <script>
        const papers = [
            {
                id: '3dgs_survey',
                sub: 'SURVEY PAPER',
                title: '3D Gaussian Splatting: Survey, Technologies, Challenges, and Opportunities',
                url: 'paper_3dgs.html',
                cover: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1974&auto=format&fit=crop'
            }
        ];

        function showPapers() {
            if (window.lenis) window.lenis.scrollTo(0, { immediate: true });
            else window.scrollTo(0, 0);

            const container = document.getElementById('dynamic-content-area');
            const hero = document.querySelector('.exhibition-hero');
            
            if (window.toggle3DModel) window.toggle3DModel(true);
            
            hero.style.display = 'flex';
            
            let htmlStr = '<section class="portfolio-deck" style="padding-top: 5vh; grid-template-columns: 1fr; margin-bottom: 5vh;">';
            papers.forEach(p => {
                htmlStr += `
                <div class="portfolio-card" onclick="window.location.href='${p.url}'" style="height: 350px; display: flex; flex-direction: column;">
                    <div class="card-image-placeholder" style="flex: 1; background: url('${p.cover}') center/cover; position: relative; display: flex; justify-content: center; align-items: center;">
                    </div>
                    <div class="card-info" style="padding: 1.5rem;">
                        <p class="section-subtitle">${p.sub}</p>
                        <h3 style="font-size: 2rem;">${p.title}</h3>
                    </div>
                </div>`;
            });
            htmlStr += '</section>';
            
            container.style.opacity = 0;
            container.innerHTML = htmlStr;
            gsap.to(container, { opacity: 1, duration: 1.0, ease: "power2.out" });
        }

        window.addEventListener('DOMContentLoaded', showPapers);

    </script>
</body>
</html>

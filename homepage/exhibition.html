<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition | 3D Gaussian Splatting</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body class="exhibition-page">
    <!-- Navigation -->
    <nav class="nav-glass" style="justify-content: flex-start; gap: 1.5rem;">
        <div class="menu-btn" onclick="toggleSidebar()">
            <div class="h-line"></div>
            <div class="h-line"></div>
            <div class="h-line"></div>
        </div>
        <div class="logo"><a href="index.html">CreatorTheGaphi<span>.</span></a></div>
    </nav>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar" data-lenis-prevent>
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <ul class="sidebar-links">
            <li><a href="index.html#vision" onclick="toggleSidebar()">Vision</a></li>
            <li><a href="exhibition.html">Exhibition</a></li>
            <li><a href="artworks.html">Artworks</a></li>
            <li><a href="index.html#commission" onclick="toggleSidebar()">Commission</a></li>
        </ul>
    </div>

    <!-- Background Canvas (3D scene background) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Back Button (Hidden by default) -->
    <button id="category-back-btn" class="btn-primary" style="display: none; margin: 3rem 5%; background: transparent; border: 1px solid var(--primary-color); position: relative; z-index: 10;" onclick="showExhibitions()">
        BACK TO EXHIBITIONS
    </button>

    <!-- Exhibition Header -->
    <header class="exhibition-hero" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2;">
        <div class="container text-center reveal-text" data-speed="1.1">
            <h1 class="section-title" id="main-hero-title" style="font-size: clamp(3rem, 7vw, 5rem); margin-bottom: 1rem;">THE EXHIBITION</h1>
            <p class="body-text" id="main-hero-subtitle" style="font-size: 1.2rem; color: var(--text-muted);">Select a project to explore its digital twin.</p>
        </div>
        
        <div style="position: absolute; bottom: 35px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fadeBob 2s infinite;">
                <span style="font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; font-family: var(--font-tech); color: var(--text-muted); padding-left: 3px;">Scroll Down</span>
                <div style="width: 1px; height: 50px; background: linear-gradient(to bottom, rgba(255,255,255,0.75), rgba(255,255,255,0.05));"></div>
            </div>
        </div>
    </header>

    <!-- Dynamic Content Area -->
    <div id="dynamic-content-area" style="position: relative; z-index: 2; width: 100%;">
        <!-- Projects injected here -->
    </div>

    <!-- Back to Main Button -->
    <div class="back-to-main" style="display: flex; flex-direction: column; align-items: center; padding: 5rem 0 10rem 0; position: relative; z-index: 10;">
        <div style="width: 1px; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7)); margin-bottom: 2rem;"></div>
        <a href="index.html" id="footer-back-btn" class="btn-primary" style="background: transparent; border: 1px solid var(--primary-color);">BACK TO MAIN</a>
    </div>
    
    <footer>
        <p>&copy; 2026 CreatorTheGaphi. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="data/faceData.js"></script>
    <script src="js/script.js"></script>
    <script>
        const exhibitions = [
            {
                id: 'arch',
                sub: 'PROJECT 01',
                title: 'Architectural Visualization',
                desc: 'By capturing large-scale luxury properties with drone photogrammetry and ground-level LIDAR, this project demonstrates the ability of 3D Gaussian Splatting to render massive architectural environments at 60FPS. Walk through future blueprints in uncompromised photorealism.',
                cover: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=2070&auto=format&fit=crop'
            },
            {
                id: 'auto',
                sub: 'PROJECT 02',
                title: 'Automotive Elegance',
                desc: 'A study in specular reflections and metallic surfaces. This project captures the bespoke material finishes of high-end vehicles. Unlike traditional photogrammetry, 3DGS perfectly preserves the anisotropic highlights and clearcoat reflections of automotive paint.',
                cover: 'https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069&auto=format&fit=crop'
            },
            {
                id: 'human',
                sub: 'PROJECT 03',
                title: 'The Human Form',
                desc: 'Exploring the intersection of biology and computer vision. This dataset captures the intricate folds of fabric and subtle skin scattering of human subjects, providing a deeply artistic volumetric preservation of a fleeting moment.',
                cover: 'https://images.unsplash.com/photo-1510832842233-43602daddfac?q=80&w=2070&auto=format&fit=crop'
            }
        ];

        function showExhibitions() {
            if (window.lenis) window.lenis.scrollTo(0, { immediate: true });
            else window.scrollTo(0, 0);

            const container = document.getElementById('dynamic-content-area');
            const backBtn = document.getElementById('category-back-btn');
            const hero = document.querySelector('.exhibition-hero');
            const footerBtn = document.getElementById('footer-back-btn');
            
            if (footerBtn) {
                footerBtn.innerText = "BACK TO MAIN";
                footerBtn.href = "index.html";
                footerBtn.onclick = null;
            }
            
            // 3D 모델 다시 서서히 나타나게 하기
            if (typeof window.modelFade === 'undefined') window.modelFade = 1.0;
            gsap.to(window, { modelFade: 1.0, duration: 1.5, ease: "power2.inOut" });
            
            backBtn.style.display = 'none';
            hero.style.display = 'flex';
            
            // 세로로 길게 이어지는 와이드 블럭 스타일 적용 (grid-template-columns: 1fr)
            let htmlStr = '<section class="portfolio-deck" style="padding-top: 5vh; grid-template-columns: 1fr; margin-bottom: 5vh;">';
            exhibitions.forEach(ex => {
                htmlStr += `
                <div class="portfolio-card" onclick="openExhibition('${ex.id}')" style="height: 350px; display: flex; flex-direction: column;">
                    <div class="card-image-placeholder" style="flex: 1; background: url('${ex.cover}') center/cover; position: relative; display: flex; justify-content: center; align-items: center;">
                        <span style="font-family: var(--font-tech); color: rgba(255,255,255,0.5);">${ex.sub}</span>
                    </div>
                    <div class="card-info" style="padding: 1.5rem;">
                        <p class="section-subtitle">${ex.sub}</p>
                        <h3 style="font-size: 2rem;">${ex.title}</h3>
                    </div>
                </div>`;
            });
            htmlStr += '</section>';
            
            container.style.opacity = 0;
            container.innerHTML = htmlStr;
            gsap.to(container, { opacity: 1, duration: 1.0, ease: "power2.out" });
        }

        function openExhibition(id) {
            const ex = exhibitions.find(e => e.id === id);
            if (!ex) return;
            
            // 3D 모델 희미하게 사라지게 하기
            if (typeof window.modelFade === 'undefined') window.modelFade = 1.0;
            gsap.to(window, { modelFade: 0.0, duration: 1.5, ease: "power2.inOut" });
            
            const container = document.getElementById('dynamic-content-area');
            const hero = document.querySelector('.exhibition-hero');
            const footerBtn = document.getElementById('footer-back-btn');
            
            if (footerBtn) {
                footerBtn.innerText = "BACK TO EXHIBITIONS";
                footerBtn.href = "#";
                footerBtn.onclick = (e) => {
                    e.preventDefault();
                    showExhibitions();
                };
            }
            
            hero.style.display = 'none';
            
            if (window.lenis) window.lenis.scrollTo(0, { immediate: true });
            else window.scrollTo(0, 0);
            
            let htmlStr = `
                <div class="category-hero" style="min-height: 100vh; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; padding: 0 1rem; box-sizing: border-box;">
                    <h1 style="font-family: var(--font-heading); font-size: clamp(2rem, 6vw, 6rem); font-weight: 700; letter-spacing: 0.1em; color: var(--text-color); text-transform: uppercase; margin: 0; line-height: 1.2; text-shadow: 0 0 40px rgba(255,255,255,0.2); word-break: keep-all;">
                        ${ex.title}
                    </h1>
                    <p style="margin-top: 1rem; color: var(--text-muted); font-size: 1.2rem; font-family: var(--font-tech); letter-spacing: 2px;">${ex.sub}</p>
                    
                    <div style="position: absolute; bottom: 35px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10;">
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fadeBob 2s infinite;">
                            <span style="font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; font-family: var(--font-tech); color: var(--text-muted); padding-left: 3px;">Scroll Down</span>
                            <div style="width: 1px; height: 50px; background: linear-gradient(to bottom, rgba(255,255,255,0.75), rgba(255,255,255,0.05));"></div>
                        </div>
                    </div>
                </div>

                <div class="aph-text-section" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4rem 2rem; box-sizing: border-box; margin-bottom: 12vh;">
                    <div style="max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 2rem; text-align: center;">
                        <p style="color: var(--text-muted); font-size: 1.15rem; line-height: 2; font-family: var(--font-body); margin: 0; word-break: keep-all;">
                            ${ex.desc}
                        </p>
                    </div>
                </div>
                
                <div style="max-width: 1400px; margin: 0 auto; padding: 0 5%; margin-bottom: 20vh;">
                    <div style="width: 100%; height: 70vh; background: url('${ex.cover}') center/cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);"></div>
                </div>
            `;
            
            container.style.opacity = 0;
            container.innerHTML = htmlStr;
            gsap.to(container, { opacity: 1, duration: 1.0, ease: "power2.out" });
        }

        // 초기 화면 로드
        window.addEventListener('DOMContentLoaded', showExhibitions);

    </script>
</body>
</html>
